seed: 42
data_root: ./data
run_dir: ./runs/pfm_mnist

model:
  size: 64
  text_dim: 64
  latent_dim: 64
  num_layers: 4
  base_channels: 64
  wavelength: 6.35e-7
  dx: 3.6e-6
  dz: 0.04
  pad_factor: 2
  source_floor: 0.03
  phase_scale: 3.141592653589793

train:
  epochs: 80
  batch_size: 64
  num_workers: 2
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  amp: false
  vis_every: 500
  save_every: 1

  # Stable generation first, physics guidance later.
  # The model first learns a clean optical endpoint mapping, then gradually
  # receives phase-gradient/TIE supervision. This is much more stable than
  # enabling all physics losses from the first iteration.
  t_min: 0.65
  pure_noise_prob: 0.10
  physics_start_epoch: 20
  physics_ramp_epochs: 25
  diversity_ramp_epochs: 10

loss:
  # Main image-quality losses, close to the stable pfm_mnist_v2 behavior.
  lambda_density: 1.0
  lambda_multiscale: 0.35
  lambda_ssim: 0.20

  # PFM-theory losses. These are ramped in train.py, so the effective weight
  # is zero during warm-up and reaches the values below after the ramp.
  lambda_flow: 0.001
  lambda_tie: 0.0001

  # Diversity is kept moderate to avoid sacrificing digit quality.
  lambda_diversity: 0.06
  diversity_margin: 0.08

  # Anti-collapse and phase regularization.
  lambda_ipr: 0.05
  lambda_peak: 0.03
  lambda_phase_tv: 2.0e-4

  target_floor: 1.0e-4
  target_blur_sigma: 0.6
  flow_samples: 128
