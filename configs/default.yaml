seed: 42
data_root: ./data
run_dir: ./runs/pfm_mnist_nogan

model:
  size: 64
  text_dim: 64
  latent_dim: 64
  num_layers: 4
  base_channels: 64
  wavelength: 6.35e-7
  dx: 3.6e-6
  dz: 0.04
  pad_factor: 2
  source_floor: 0.03
  phase_scale: 3.141592653589793

train:
  epochs: 80
  batch_size: 64
  num_workers: 2
  lr: 2.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0
  amp: false
  vis_every: 500
  save_every: 1
  t_min: 0.75
  pure_noise_prob: 0.45

loss:
  lambda_density: 1.0
  lambda_multiscale: 0.35
  lambda_flow: 0.08
  lambda_tie: 0.02
  lambda_diversity: 0.18
  lambda_ipr: 0.05
  lambda_peak: 0.03
  lambda_phase_tv: 1.5e-4
  target_floor: 1.0e-4
  target_blur_sigma: 0.6
  diversity_margin: 0.08
  flow_samples: 256
